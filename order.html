<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Order Online - CarePlus</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f8f7;
        }

        .navbar {
            background: #16423c;
            padding: 15px 25px;
        }

        .navbar-brand {
            color: white !important;
            font-size: 27px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .navbar-nav {
            gap: 10px;
        }

        .nav-link {
            color: #d9eeeb !important;
        }

        .nav-link:hover {
            color: white !important;
        }

        .navbar-toggler {
            background: white;
        }

        .page-header {
            margin-top: 45px;
            background: #dcefeb;
            padding: 70px 20px;
            text-align: center;
        }

        .page-header h1 {
            color: #16423c;
            font-weight: bold;
        }

        .order-box {
            max-width: 700px;
            margin: 60px auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .btn-main {
            background: #36a58c;
            color: white;
            border: none;
        }

        .btn-main:hover {
            background: #27816f;
            color: white;
        }

        footer {
            background: #16423c;
            color: white;
            padding: 45px 20px;
            text-align: center;
        }

        footer a {
            color: #d9eeeb;
            text-decoration: none;
            display: block;
            margin-bottom: 8px;
        }

        .social-icons a {
            display: inline-block;
            font-size: 23px;
            margin-right: 12px;
        }

    </style>

</head>

<body>

<nav class="navbar navbar-expand-lg">

    <div class="container-fluid">

        <a class="navbar-brand" href="index.html">CarePlus</a>

        <button class="navbar-toggler"
                type="button"
                onclick="toggleMenu()">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navLinks">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="products.html">Medicines</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="about.html">About</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="services.html">Services</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="order.html">Order</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="cart.html">Cart</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="reviews.html">Reviews</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="contact.html">Contact</a>
                </li>

            </ul>

        </div>

    </div>

</nav>


<section class="page-header">

    <h1>Order Online</h1>

    <p>
        Send us your order details.
    </p>

</section>


<div class="container">

    <div class="order-box">

        <h2 class="text-center mb-4">
            Place Your Order
        </h2>

        <form onsubmit="placeOrder(event)">

            <div class="mb-3">

                <label class="form-label">
                    Full Name
                </label>

                <input type="text"
                       id="name"
                       class="form-control"
                       required>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Phone Number
                </label>

                <input type="tel"
                       id="phone"
                       class="form-control"
                       required>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Select Product
                </label>

                <select id="product"
                        class="form-select"
                        required>

                    <option value="">
                        Select a product
                    </option>

                    <option>Pain Relief Tablets</option>

                    <option>Vitamin Supplements</option>

                    <option>First Aid Kit</option>

                    <option>Digital Thermometer</option>

                    <option>BP Monitor</option>

                    <option>Pulse Oximeter</option>

                    <option>Baby Care Products</option>

                    <option>Personal Care</option>

                </select>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Quantity
                </label>

                <input type="number"
                       id="quantity"
                       class="form-control"
                       min="1"
                       value="1"
                       required>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Address
                </label>

                <textarea id="address"
                          class="form-control"
                          rows="4"
                          required></textarea>

            </div>


            <button class="btn btn-main w-100">
                Place Order
            </button>

        </form>

        <p id="orderMessage"
           class="text-center mt-4">
        </p>

    </div>

</div>


<footer>

    <div class="container">

        <div class="row g-4">

            <div class="col-md-4">

                <h4>CarePlus</h4>

                <p>Your trusted medical store.</p>

            </div>

            <div class="col-md-4">

                <h4>Quick Links</h4>

                <a href="index.html">Home</a>
                <a href="products.html">Medicines</a>
                <a href="services.html">Services</a>
                <a href="contact.html">Contact</a>

            </div>

            <div class="col-md-4">

                <h4>Follow Us</h4>

                <div class="social-icons">

                    <a href="https://www.facebook.com/">
                        <i class="bi bi-facebook"></i>
                    </a>

                    <a href="https://x.com/">
                        <i class="bi bi-twitter-x"></i>
                    </a>

                    <a href="https://www.instagram.com/">
                        <i class="bi bi-instagram"></i>
                    </a>

                    <a href="https://www.linkedin.com/">
                        <i class="bi bi-linkedin"></i>
                    </a>

                </div>

            </div>

        </div>

        <hr>

        <p class="text-center mb-0">
            © 2026 CarePlus Medical Store
        </p>

    </div>

</footer>


<script>

    function toggleMenu() {

        document.getElementById("navLinks")
                .classList.toggle("show");

    }


    function placeOrder(event) {

        event.preventDefault();

        let name = document.getElementById("name").value;

        let product = document.getElementById("product").value;

        let quantity = document.getElementById("quantity").value;

        document.getElementById("orderMessage").innerHTML =
            "Thank you <strong>" + name +
            "</strong>! Your order for <strong>" +
            quantity + " × " + product +
            "</strong> has been received.";

        console.log("Order placed for: " + product);

        window.alert("Your order has been placed!");

    }

</script>

</body>

</html>
